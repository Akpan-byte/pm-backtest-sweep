    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pandas numpy
      - name: Fetch NQ data
        run: |
          mkdir -p data
          curl -L -o data/NQ_5min.csv https://github.com/Akpan-byte/pm-backtest-sweep/releases/download/omar-data-20260806/NQ_5min.csv
      - name: Run config
        run: |
          cd strategies/omar_no_wick
          python3 run_config.py \
            --data-path ../../data/NQ_5min.csv \
            --filters "${{ matrix.config.filters }}" \
            --session-start "${{ matrix.config.start }}" \
            --session-end "${{ matrix.config.end }}" \
            --output "results/${{ matrix.config.name }}.json"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${ matrix.config.name }
          path: strategies/omar_no_wick/results/${ matrix.config.name }.json
